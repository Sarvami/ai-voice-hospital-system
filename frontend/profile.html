<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile – AI Voice Hospital</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── Avatar sits above the card content ── */
    .avatar-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
    }

    .avatar-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      margin-bottom: 14px;
      box-shadow: 0 0 0 4px rgba(79,195,247,0.2), 0 12px 30px rgba(0,0,0,0.4);
    }

    .avatar-name {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.2;
    }

    .avatar-name span {
      color: var(--accent);
    }

    /* ── Info rows ── */
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      margin-bottom: 10px;
    }

    .info-label {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--muted);
    }

    .info-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
    }

    /* ── Buttons ── */
    .btn-ghost {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: 'Sora', 'Segoe UI', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      margin-top: 8px;
    }

    .btn-ghost:hover {
      background: rgba(255,255,255,0.05);
      color: var(--text);
    }

    .btn-red {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(239,68,68,0.35);
      background: transparent;
      color: var(--error);
      font-family: 'Sora', 'Segoe UI', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }

    .btn-red:hover {
      background: rgba(239,68,68,0.08);
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-left">
      <span class="logo">AI Voice Hospital</span>
    </div>
    <div class="nav-right">
      <button class="nav-btn" onclick="window.location.href='indexx.html'">Dashboard</button>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </nav>

  <!-- Glass Card -->
  <div class="glass-card" style="max-width:460px; min-height:auto; padding:36px 30px;">

    <div class="top-bar">AI VOICE HOSPITAL</div>

    <!-- Avatar + Name -->
    <div class="avatar-wrap">
      <div class="avatar-circle" id="avatarEmoji">👤</div>
      <div class="avatar-name">My <span>Profile.</span></div>
    </div>

    <!-- Info Rows -->
    <div class="info-row">
      <span class="info-label">Full Name</span>
      <span class="info-value" id="profileName">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">Patient ID</span>
      <span class="info-value" id="profileId">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">Phone Number</span>
      <span class="info-value" id="profilePhone">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">Age</span>
      <span class="info-value" id="profileAge">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">Gender</span>
      <span class="info-value" id="profileGender">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">Preferred Language</span>
      <span class="info-value" id="profileLang">—</span>
    </div>

    <!-- Actions -->
    <button class="btn" onclick="window.location.href='indexx.html'">
      🎤 &nbsp; Go to Dashboard
    </button>
    <button class="btn-red" onclick="logout()">Logout</button>

  </div>

  <script>
    const langMap = {
      en: "English", hi: "Hindi", mr: "Marathi",
      ta: "Tamil",   te: "Telugu", gu: "Gujarati"
    };

    function loadProfile() {
      const patient = JSON.parse(localStorage.getItem("patient") || "{}");

      if (!patient || !patient.id) {
        window.location.href = "login.html";
        return;
      }

      const gender = (patient.gender || "").toLowerCase();
      document.getElementById("avatarEmoji").textContent =
        gender === "female" ? "👩" : gender === "male" ? "👨" : "👤";

      document.getElementById("profileName").textContent   = patient.name   || "—";
      document.getElementById("profilePhone").textContent  = patient.phone  || "—";
      document.getElementById("profileAge").textContent    = patient.age    || "—";
      document.getElementById("profileGender").textContent = patient.gender || "—";
      document.getElementById("profileId").textContent     = "#" + patient.id;

      const lang = patient.preferred_language || patient.language || "en";
      document.getElementById("profileLang").textContent  = langMap[lang] || lang;
    }

    function logout() {
      localStorage.removeItem("patient");
      localStorage.removeItem("patient_id");
      window.location.href = "login.html";
    }

    loadProfile();
  </script>

</body>
</html>
