<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile – AI Voice Hospital</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Profile specific styles - maintains theme consistency */
    
    /* Avatar wrapper */
    .avatar-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
    }

    .avatar-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      margin-bottom: 14px;
      box-shadow: 0 0 0 4px rgba(79,195,247,0.2), 0 12px 30px rgba(0,0,0,0.4);
      transition: transform 0.2s;
    }

    .avatar-circle:hover {
      transform: scale(1.05);
    }

    .avatar-name {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.2;
    }

    .avatar-name span {
      color: var(--accent);
    }

    /* Info rows - consistent with glass card theme */
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      margin-bottom: 10px;
      transition: all 0.2s;
    }

    .info-row:hover {
      background: rgba(255,255,255,0.08);
      border-color: var(--accent);
    }

    .info-label {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--muted);
    }

    .info-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
    }

    /* Consistent button styles with main page */
    .btn-primary {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      font-family: 'Sora', 'Segoe UI', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
      border: none;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(79,195,247,0.3);
    }

    .btn-danger {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(239,68,68,0.35);
      background: transparent;
      color: var(--error);
      font-family: 'Sora', 'Segoe UI', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }

    .btn-danger:hover {
      background: rgba(239,68,68,0.08);
      border-color: var(--error);
    }

    /* Profile icon in navbar */
    .profile-icon-nav {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .profile-icon-nav:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(79,195,247,0.4);
    }

    /* Navbar right alignment */
    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Ensure glass card has consistent padding */
    .glass-card {
      max-width: 460px;
      padding: 36px 30px;
    }
  </style>
</head>
<body>

  <!-- Navbar - Matches main page exactly -->
  <nav class="navbar">
    <div class="nav-left">
      <span class="logo">AI Voice Hospital</span>
    </div>
    <div class="nav-right">
      <button class="nav-btn" onclick="window.location.href='indexx.html'">
        Dashboard
      </button>
      
      <!-- Profile Icon - same as main page -->
      <div class="profile-icon-nav" id="profileIconNav" onclick="window.location.href='profile.html'">
        👤
      </div>
      
      <button class="logout-btn" onclick="logout()">
        Logout
      </button>
    </div>
  </nav>

  <!-- Glass Card - consistent with main page -->
  <div class="glass-card">

    <div class="top-bar">AI VOICE HOSPITAL</div>

    <!-- Avatar + Name -->
    <div class="avatar-wrap">
      <div class="avatar-circle" id="avatarEmoji">👤</div>
      <div class="avatar-name">My <span>Profile.</span></div>
    </div>

    <!-- Info Rows -->
    <div class="info-row">
      <span class="info-label">Full Name</span>
      <span class="info-value" id="profileName">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">Patient ID</span>
      <span class="info-value" id="profileId">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">Phone Number</span>
      <span class="info-value" id="profilePhone">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">Age</span>
      <span class="info-value" id="profileAge">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">Gender</span>
      <span class="info-value" id="profileGender">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">Preferred Language</span>
      <span class="info-value" id="profileLang">—</span>
    </div>

    <!-- Actions - using consistent button classes -->
    <button class="btn-primary" onclick="window.location.href='indexx.html'">
      🎤 &nbsp; Go to Dashboard
    </button>
    <button class="btn-danger" onclick="logout()">
      🚪 &nbsp; Logout
    </button>

  </div>

  <script>
    const langMap = {
      en: "English", hi: "Hindi", mr: "Marathi",
      ta: "Tamil", te: "Telugu", gu: "Gujarati"
    };

    function loadProfile() {
      const patient = JSON.parse(localStorage.getItem("patient") || "{}");

      if (!patient || !patient.id) {
        window.location.href = "login.html";
        return;
      }

      const gender = (patient.gender || "").toLowerCase();
      const avatarEmoji = document.getElementById("avatarEmoji");
      const profileIconNav = document.getElementById("profileIconNav");
      
      // Set avatar emoji based on gender
      if (gender === "female") {
        avatarEmoji.textContent = "👩";
        if (profileIconNav) profileIconNav.textContent = "👩";
      } else if (gender === "male") {
        avatarEmoji.textContent = "👨";
        if (profileIconNav) profileIconNav.textContent = "👨";
      } else {
        const firstLetter = (patient.name || "U").charAt(0).toUpperCase();
        avatarEmoji.textContent = firstLetter;
        if (profileIconNav) profileIconNav.textContent = firstLetter;
      }

      // Set gradient colors based on gender
      if (gender === "female") {
        const gradient = "linear-gradient(135deg, #FF6B6B, #FF8E8E)";
        avatarEmoji.style.background = gradient;
        if (profileIconNav) profileIconNav.style.background = gradient;
      } else if (gender === "male") {
        const gradient = "linear-gradient(135deg, #4A90E2, #6BA5F0)";
        avatarEmoji.style.background = gradient;
        if (profileIconNav) profileIconNav.style.background = gradient;
      } else {
        const gradient = "linear-gradient(135deg, var(--accent), var(--accent2))";
        avatarEmoji.style.background = gradient;
        if (profileIconNav) profileIconNav.style.background = gradient;
      }

      // Populate profile information
      document.getElementById("profileName").textContent = patient.name || "—";
      document.getElementById("profilePhone").textContent = patient.phone || "—";
      document.getElementById("profileAge").textContent = patient.age || "—";
      document.getElementById("profileGender").textContent = patient.gender || "—";
      document.getElementById("profileId").textContent = "#" + patient.id;

      const lang = patient.preferred_language || patient.language || "en";
      document.getElementById("profileLang").textContent = langMap[lang] || lang;
    }

    function logout() {
      if (confirm('Are you sure you want to logout?')) {
        localStorage.removeItem("patient");
        localStorage.removeItem("patient_id");
        window.location.href = "login.html";
      }
    }

    // Load profile when page loads
    document.addEventListener("DOMContentLoaded", loadProfile);
  </script>

</body>
</html>
