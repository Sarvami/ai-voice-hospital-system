<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — AI Voice Hospital</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0f1e;
      --card: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.1);
      --accent: #4fc3f7;
      --accent2: #7c83fd;
      --text: #e8eaf6;
      --muted: #7986cb;
      --error: #ef9a9a;
      --success: #a5d6a7;
    }

    body {
      font-family: 'Sora', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(124,131,253,0.08) 0%, transparent 70%);
      top: -100px; right: -100px;
      animation: drift 9s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes drift { from { transform: translate(0,0); } to { transform: translate(30px, 30px); } }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      animation: fadeUp 0.6s ease both;
    }
    @keyframes fadeUp { from { opacity:0; transform: translateY(24px); } to { opacity:1; transform: translateY(0); } }

    .logo {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 32px;
      line-height: 1.2;
    }
    h1 span { color: var(--accent2); }

    .field { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 7px;
    }

    input, select {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      color: var(--text);
      font-family: 'Sora', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      appearance: none;
    }
    input:focus, select:focus {
      border-color: var(--accent2);
      background: rgba(124,131,253,0.05);
    }
    select option { background: #1a1f35; }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .btn {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      color: #0a0f1e;
      font-family: 'Sora', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:active { transform: scale(0.98); }

    .msg {
      margin-top: 14px;
      font-size: 13px;
      min-height: 20px;
      text-align: center;
    }
    .msg.error { color: var(--error); }
    .msg.success { color: var(--success); }

    .login-link {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }
    .login-link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .login-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">AI Voice Hospital</div>
  <h1>Create your<br><span>account.</span></h1>

  <div class="field">
    <label>Full Name</label>
    <input id="reg-name" type="text" placeholder="Your full name">
  </div>

  <div class="row">
    <div class="field">
      <label>Age</label>
      <input id="reg-age" type="number" placeholder="Age" min="1" max="120">
    </div>
    <div class="field">
      <label>Gender</label>
      <select id="reg-gender">
        <option value="">Select</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>
    </div>
  </div>

  <div class="field">
    <label>Phone Number</label>
    <input id="reg-phone" type="tel" placeholder="10-digit phone number">
  </div>

  <div class="field">
    <label>Password</label>
    <input id="reg-password" type="password" placeholder="Create a password">
  </div>

  <div class="field">
    <label>Preferred Language</label>
    <select id="reg-language">
      <option value="en">English</option>
      <option value="hi">Hindi</option>
      <option value="mr">Marathi</option>
    </select>
  </div>

  <button class="btn" id="registerBtn">Create Account</button>
  <p class="msg" id="reg-msg"></p>

  <div class="login-link">
    Already have an account? <a href="login.html">Login</a>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
