<!DOCTYPE html>
<html>
<head>
<title>Patient Profile</title>

<style>

body{
    font-family: Arial;
    background: #0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* main card */

.profile-container{
    width:420px;
    background:#111827;
    padding:35px;
    border-radius:12px;
    box-shadow:0 0 25px rgba(0,0,0,0.4);
}

.title{
    text-align:center;
    color:white;
    font-size:22px;
    margin-bottom:25px;
}

/* input boxes */

.input-box{
    margin-bottom:20px;
}

.input-box label{
    color:#94a3b8;
    font-size:14px;
}

.input-box input{
    width:100%;
    padding:12px;
    margin-top:6px;
    border:none;
    border-radius:6px;
    background:#1f2937;
    color:white;
    font-size:15px;
}

/* button */

.save-btn{
    width:100%;
    padding:12px;
    background:#06b6d4;
    border:none;
    border-radius:6px;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.save-btn:hover{
    background:#0891b2;
}

.logout{
    margin-top:15px;
    text-align:center;
    color:#94a3b8;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="profile-container">

<div class="title">Create Patient Profile</div>

<div class="input-box">
<label>Full Name</label>
<input type="text" id="name">
</div>

<div class="input-box">
<label>Phone Number</label>
<input type="text" id="phone">
</div>

<div class="input-box">
<label>Preferred Language</label>
<input type="text" id="language">
</div>

<button class="save-btn" onclick="saveProfile()">Save Profile</button>

<div class="logout" onclick="logout()">Logout</div>

</div>

<script>

/* load stored values */

document.getElementById("name").value =
localStorage.getItem("name") || "";

document.getElementById("phone").value =
localStorage.getItem("phone") || "";

document.getElementById("language").value =
localStorage.getItem("lang") || "";


/* save profile */

function saveProfile(){

localStorage.setItem("name",
document.getElementById("name").value);

localStorage.setItem("phone",
document.getElementById("phone").value);

localStorage.setItem("lang",
document.getElementById("language").value);

alert("Profile Saved");

}


/* logout */

function logout(){
localStorage.clear();
window.location.href="login.html";
}

</script>

</body>
</html>
