<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | SwasthSeva</title>
  <link rel="stylesheet" href="../shared/style.css">
  <style>
    .profile-container-page {
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
    }
    
    /* Profile Page Theme Overrides */
    .profile-card {
      background: var(--card);
      backdrop-filter: blur(14px);
      border-radius: 28px;
      border: 1px solid var(--border);
      padding: 32px;
      animation: fadeUp 0.5s ease;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    
    body.light-theme .profile-card {
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 10px 40px rgba(0,0,0,0.05);
    }
    
    .profile-avatar-large {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      margin: 0 auto 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      opacity: 0.8;
    }
    
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      font-size: 14px;
      font-family: 'Sora', sans-serif;
      transition: all 0.2s;
    }

    body.light-theme .form-group input,
    body.light-theme .form-group select {
      background: rgba(0,0,0,0.03);
    }
    
    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(79,195,247,0.2);
    }
    
    .form-group input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .btn-save {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Sora', sans-serif;
      transition: all 0.2s;
      margin-top: 10px;
    }
    
    body.light-theme .btn-save {
      color: #ffffff;
    }

    .btn-save:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.3);
    }
    
    .btn-back {
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      opacity: 0.7;
      font-size: 14px;
      cursor: pointer;
      font-family: 'Sora', sans-serif;
      margin-top: 12px;
      transition: all 0.2s;
    }
    
    .btn-back:hover {
      background: rgba(255,255,255,0.05);
      border-color: var(--accent);
      opacity: 1;
    }

    body.light-theme .btn-back:hover {
      background: rgba(0,0,0,0.03);
    }
    
    .success-badge {
      background: rgba(76,175,80,0.15);
      color: #4caf50;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      text-align: center;
      margin-bottom: 20px;
      display: none;
    }
    
    .success-badge.show {
      display: block;
      animation: slideIn 0.3s ease;
    }
    
    .info-note {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-left">
      <span class="logo">🎙️ SwasthSeva</span>
    </div>
    <div class="nav-right">
      <button class="nav-btn theme-btn" id="themeToggleBtn" onclick="toggleTheme()">🌙</button>
      <div class="profile-container">
        <div class="profile-icon" id="profileIcon">👤</div>
      </div>
    </div>
  </nav>

  <div class="page-center">
    <div class="profile-container-page">
      <div class="profile-card">
        <div class="profile-avatar-large" id="profileAvatar">👤</div>
        
        <div class="success-badge" id="successBadge">
          ✅ Profile updated successfully!
        </div>
        
        <form id="profileForm">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="fullName" placeholder="Enter your full name">
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label>Age</label>
              <input type="number" id="age" placeholder="Age">
            </div>
            <div class="form-group">
              <label>Gender</label>
              <select id="gender">
                <option value="">Select</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
              </select>
            </div>
          </div>
          
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="phone" placeholder="10-digit mobile number" disabled>
            <div class="info-note">📞 Phone number cannot be changed</div>
          </div>
          
          <div class="form-group">
            <label>Preferred Language</label>
            <select id="language">
              <option value="hi">Hindi</option>
              <option value="en">English</option>
              <option value="mr">Marathi</option>
              <option value="ta">Tamil</option>
              <option value="te">Telugu</option>
              <option value="gu">Gujarati</option>
            </select>
          </div>
          
          <button type="submit" class="btn-save">💾 Save Changes</button>
          <button type="button" class="btn-back" onclick="goBack()">← Back to Home</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const BACKEND = "http://127.0.0.1:8000";
    
    // Load profile data
    function loadProfile() {
      const patient = JSON.parse(localStorage.getItem("patient") || "{}");
      const name = localStorage.getItem("name") || patient.name || "";
      const age = localStorage.getItem("age") || patient.age || "";
      const gender = localStorage.getItem("gender") || patient.gender || "";
      const phone = localStorage.getItem("phone") || patient.phone || "";
      const language = localStorage.getItem("lang") || patient.language || "hi";
      
      document.getElementById("fullName").value = name;
      document.getElementById("age").value = age;
      document.getElementById("gender").value = gender;
      document.getElementById("phone").value = phone;
      document.getElementById("language").value = language;
      
      // Update avatar
      const avatarEl = document.getElementById("profileAvatar");
      const genderVal = gender.toLowerCase();
      if (genderVal === "female") {
        avatarEl.innerHTML = "👩";
        avatarEl.style.background = "linear-gradient(135deg, #FF8E8E, #FF6B6B)";
      } else if (genderVal === "male") {
        avatarEl.innerHTML = "👨";
        avatarEl.style.background = "linear-gradient(135deg, #4A90E2, #6BA5F0)";
      } else {
        avatarEl.innerHTML = name ? name.charAt(0).toUpperCase() : "👤";
      }
    }
    
    // Save profile data
    document.getElementById("profileForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const name = document.getElementById("fullName").value.trim();
      const age = document.getElementById("age").value.trim();
      const gender = document.getElementById("gender").value;
      const language = document.getElementById("language").value;
      const phone = document.getElementById("phone").value;
      
      if (!name) {
        alert("Please enter your name");
        return;
      }
      
      // Update localStorage
      localStorage.setItem("name", name);
      localStorage.setItem("age", age);
      localStorage.setItem("gender", gender);
      localStorage.setItem("lang", language);
      
      // Update patient object
      const patient = JSON.parse(localStorage.getItem("patient") || "{}");
      patient.name = name;
      patient.age = age;
      patient.gender = gender;
      patient.language = language;
      localStorage.setItem("patient", JSON.stringify(patient));
      
      // Send to backend if patient_id exists
      const patientId = localStorage.getItem("patient_id");
      if (patientId) {
        try {
          const response = await fetch(`${BACKEND}/update-profile`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              patient_id: patientId,
              name: name,
              age: age,
              gender: gender,
              language: language
            })
          });
          
          if (response.ok) {
            console.log("Profile synced with backend");
          }
        } catch (err) {
          console.error("Backend sync failed:", err);
        }
      }
      
      // Show success message
      const badge = document.getElementById("successBadge");
      badge.classList.add("show");
      setTimeout(() => {
        badge.classList.remove("show");
      }, 3000);
      
      // Update avatar
      const avatarEl = document.getElementById("profileAvatar");
      if (gender === "female") {
        avatarEl.innerHTML = "👩";
        avatarEl.style.background = "linear-gradient(135deg, #FF8E8E, #FF6B6B)";
      } else if (gender === "male") {
        avatarEl.innerHTML = "👨";
        avatarEl.style.background = "linear-gradient(135deg, #4A90E2, #6BA5F0)";
      } else {
        avatarEl.innerHTML = name.charAt(0).toUpperCase();
      }
    });
    
    function goBack() {
      window.location.href = "../index.html";
    }
    
    // Theme toggle
    function toggleTheme() {
      const isLight = document.body.classList.toggle("light-theme");
      if (isLight) {
        document.body.classList.remove("dark-theme");
        localStorage.setItem("theme", "light");
      } else {
        document.body.classList.add("dark-theme");
        localStorage.setItem("theme", "dark");
      }
      const btn = document.getElementById("themeToggleBtn");
      if (btn) btn.textContent = isLight ? "🌙" : "☀️";
    }
    
    // Apply saved theme
    const savedTheme = localStorage.getItem("theme") || "dark";
    if (savedTheme === "light") {
      document.body.classList.add("light-theme");
      document.body.classList.remove("dark-theme");
      const btn = document.getElementById("themeToggleBtn");
      if (btn) btn.textContent = "🌙";
    } else {
      document.body.classList.add("dark-theme");
      document.body.classList.remove("light-theme");
      const btn = document.getElementById("themeToggleBtn");
      if (btn) btn.textContent = "☀️";
    }
    
    // Load profile on page load
    loadProfile();
    
    // Update profile icon in navbar
    function updateNavbarProfile() {
      const patient = JSON.parse(localStorage.getItem("patient") || "{}");
      const name = localStorage.getItem("name") || patient.name || "";
      const gender = (patient.gender || "").toLowerCase();
      const profileIconEl = document.getElementById("profileIcon");
      
      if (gender === "female") {
        profileIconEl.innerHTML = "👩";
        profileIconEl.style.background = "linear-gradient(135deg, #FF8E8E, #FF6B6B)";
      } else if (gender === "male") {
        profileIconEl.innerHTML = "👨";
        profileIconEl.style.background = "linear-gradient(135deg, #4A90E2, #6BA5F0)";
      } else if (name) {
        profileIconEl.innerHTML = name.charAt(0).toUpperCase();
      } else {
        profileIconEl.innerHTML = "👤";
      }
    }
    
    updateNavbarProfile();
  </script>
</body>
</html>
