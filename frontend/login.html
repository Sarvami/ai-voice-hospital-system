<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — AI Voice Hospital</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0f1e;
      --card: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.1);
      --accent: #4fc3f7;
      --accent2: #7c83fd;
      --text: #e8eaf6;
      --muted: #7986cb;
      --error: #ef9a9a;
    }

    body {
      font-family: 'Sora', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* animated background */
    body::before {
      content: '';
      position: fixed;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(76,195,247,0.08) 0%, transparent 70%);
      top: -100px; left: -100px;
      animation: drift 8s ease-in-out infinite alternate;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(124,131,253,0.08) 0%, transparent 70%);
      bottom: -100px; right: -100px;
      animation: drift 10s ease-in-out infinite alternate-reverse;
      pointer-events: none;
    }
    @keyframes drift { from { transform: translate(0,0); } to { transform: translate(40px, 40px); } }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      position: relative;
      animation: fadeUp 0.6s ease both;
    }
    @keyframes fadeUp { from { opacity:0; transform: translateY(24px); } to { opacity:1; transform: translateY(0); } }

    .logo {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 32px;
      line-height: 1.2;
    }
    h1 span { color: var(--accent); }

    .field {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text);
      font-family: 'Sora', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    input:focus {
      border-color: var(--accent);
      background: rgba(79,195,247,0.05);
    }

    .btn {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #0a0f1e;
      font-family: 'Sora', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:active { transform: scale(0.98); }

    .msg {
      margin-top: 14px;
      font-size: 13px;
      color: var(--error);
      min-height: 20px;
      text-align: center;
    }

    .register-link {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }
    .register-link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .register-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">AI Voice Hospital</div>
  <h1>Welcome<br><span>back.</span></h1>

  <div class="field">
    <label>Phone Number</label>
    <input id="phone" type="tel" placeholder="Enter your phone number">
  </div>

  <div class="field">
    <label>Password</label>
    <input id="password" type="password" placeholder="Enter your password">
  </div>

  <button class="btn" id="loginBtn">Login</button>
  <p class="msg" id="msg"></p>

  <div class="register-link">
    New patient? <a href="profile.html">Create an account</a>
  </div>
</div>


<script>
async function login() {

  const emailInput = document.getElementById("email").value;
  const passwordInput = document.getElementById("password").value;

  const res = await fetch("http://127.0.0.1:8000/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      email: emailInput,
      password: passwordInput
    })
  });

  const data = await res.json();

  if (!data.success) {
    document.getElementById("msg").innerText = data.message;
    return;
  }

  /* ---------- STEP 2 : STORE USER DATA ---------- */

  localStorage.setItem("user", JSON.stringify(data.user));

  /* store extra data for profile page */
  localStorage.setItem("name", data.user.name || "Demo Patient");
  localStorage.setItem("phone", data.user.phone || "Not available");
  localStorage.setItem("lang", data.user.preferred_language || "hi");

  window.location.href = "profile.html";
}
</script>


<script src="script.js"></script>

</body>
</html>
