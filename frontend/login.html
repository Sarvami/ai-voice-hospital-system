<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — AI Voice Hospital</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0f1e;
      --card: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.1);
      --accent: #4fc3f7;
      --accent2: #7c83fd;
      --text: #e8eaf6;
      --muted: #7986cb;
      --error: #ef9a9a;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Sora', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(76,195,247,0.08) 0%, transparent 70%);
      top: -100px; left: -100px;
      animation: drift 8s ease-in-out infinite alternate;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(124,131,253,0.08) 0%, transparent 70%);
      bottom: -100px; right: -100px;
      animation: drift 10s ease-in-out infinite alternate-reverse;
      pointer-events: none;
    }
    @keyframes drift { from { transform: translate(0,0); } to { transform: translate(40px, 40px); } }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      position: relative;
      animation: fadeUp 0.6s ease both;
    }
    @keyframes fadeUp { from { opacity:0; transform: translateY(24px); } to { opacity:1; transform: translateY(0); } }

    .logo {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 28px;
      line-height: 1.2;
    }
    h1 span { color: var(--accent); }

    /* ── ROLE SELECTOR ── */
    .role-label {
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
      display: block;
    }

    .role-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .role-card {
      position: relative;
      cursor: pointer;
    }

    .role-card input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0; height: 0;
    }

    .role-card-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 14px 10px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: rgba(255,255,255,0.03);
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
      user-select: none;
    }

    .role-card-inner .icon {
      font-size: 22px;
      line-height: 1;
    }

    .role-card-inner .role-name {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--muted);
      transition: color 0.2s;
    }

    /* Hover */
    .role-card:hover .role-card-inner {
      border-color: rgba(79,195,247,0.4);
      background: rgba(79,195,247,0.05);
      transform: translateY(-2px);
    }

    /* Selected state per role */
    .role-card input[value="patient"]:checked ~ .role-card-inner {
      border-color: var(--accent);
      background: rgba(79,195,247,0.1);
    }
    .role-card input[value="doctor"]:checked ~ .role-card-inner {
      border-color: #69f0ae;
      background: rgba(105,240,174,0.08);
    }
    .role-card input[value="admin"]:checked ~ .role-card-inner {
      border-color: var(--accent2);
      background: rgba(124,131,253,0.1);
    }

    .role-card input[value="patient"]:checked ~ .role-card-inner .role-name { color: var(--accent); }
    .role-card input[value="doctor"]:checked ~ .role-card-inner .role-name { color: #69f0ae; }
    .role-card input[value="admin"]:checked ~ .role-card-inner .role-name { color: var(--accent2); }

    /* ── FIELDS ── */
    .field { margin-bottom: 20px; }

    label {
      display: block;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    input[type="tel"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text);
      font-family: 'Sora', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    input[type="tel"]:focus,
    input[type="password"]:focus,
    input[type="text"]:focus {
      border-color: var(--accent);
      background: rgba(79,195,247,0.05);
    }

    .btn {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #0a0f1e;
      font-family: 'Sora', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:active { transform: scale(0.98); }

    /* Role-tinted button */
    body.role-doctor .btn {
      background: linear-gradient(135deg, #69f0ae, #00bcd4);
    }
    body.role-admin .btn {
      background: linear-gradient(135deg, var(--accent2), #ce93d8);
    }

    .msg {
      margin-top: 14px;
      font-size: 13px;
      color: var(--error);
      min-height: 20px;
      text-align: center;
    }

    .register-link {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }
    .register-link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .register-link a:hover { text-decoration: underline; }

    /* ── BADGE shown after role select ── */
    .role-badge {
      display: inline-block;
      font-size: 11px;
      font-family: 'Space Mono', monospace;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 20px;
      margin-left: 8px;
      vertical-align: middle;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .role-badge.visible { opacity: 1; }
    .role-badge.patient { background: rgba(79,195,247,0.15); color: var(--accent); }
    .role-badge.doctor  { background: rgba(105,240,174,0.15); color: #69f0ae; }
    .role-badge.admin   { background: rgba(124,131,253,0.15); color: var(--accent2); }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">AI Voice Hospital</div>
  <h1>Welcome<br><span>back.</span> <span class="role-badge" id="roleBadge"></span></h1>

  <!-- ROLE SELECTOR -->
  <span class="role-label">Login as</span>
  <div class="role-cards">

    <label class="role-card">
      <input type="radio" name="role" value="patient" checked>
      <div class="role-card-inner">
        <span class="icon">🧑‍⚕️</span>
        <span class="role-name">Patient</span>
      </div>
    </label>

    <label class="role-card">
      <input type="radio" name="role" value="doctor">
      <div class="role-card-inner">
        <span class="icon">👨‍⚕️</span>
        <span class="role-name">Doctor</span>
      </div>
    </label>

    <label class="role-card">
      <input type="radio" name="role" value="admin">
      <div class="role-card-inner">
        <span class="icon">🛡️</span>
        <span class="role-name">Admin</span>
      </div>
    </label>

  </div>

  <!-- FIELDS -->
  <div class="field">
    <label>Phone Number</label>
    <input id="phone" type="tel" placeholder="Enter your phone number">
  </div>

  <div class="field">
    <label>Password</label>
    <input id="password" type="password" placeholder="Enter your password">
  </div>

  <button class="btn" id="loginBtn" onclick="login()">Login</button>
  <p class="msg" id="msg"></p>

  <div class="register-link">
    New patient? <a href="register.html">Create an account</a>
  </div>
</div>


<script>
  /* ── Role badge + body class update ── */
  const radios = document.querySelectorAll('input[name="role"]');
  const badge  = document.getElementById('roleBadge');

  const roleConfig = {
    patient: { label: 'Patient',  cls: 'patient', bodyCls: 'role-patient' },
    doctor:  { label: 'Doctor',   cls: 'doctor',  bodyCls: 'role-doctor'  },
    admin:   { label: 'Admin',    cls: 'admin',   bodyCls: 'role-admin'   },
  };

  function updateRole(val) {
    const cfg = roleConfig[val];
    badge.textContent = cfg.label;
    badge.className = 'role-badge visible ' + cfg.cls;
    document.body.className = cfg.bodyCls;
  }

  // Set default on load
  updateRole('patient');

  radios.forEach(r => {
    r.addEventListener('change', () => updateRole(r.value));
  });

  /* ── Login function ── */
  async function login() {
    const role     = document.querySelector('input[name="role"]:checked').value;
    const phone    = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value;
    const msgEl    = document.getElementById('msg');

    msgEl.textContent = '';

    if (!phone || !password) {
      msgEl.textContent = 'Please fill in all fields.';
      return;
    }

    try {
      const res = await fetch("http://127.0.0.1:8000/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone, password, role })
      });

      const data = await res.json();

      if (!data.success) {
        msgEl.textContent = data.message || 'Login failed. Please try again.';
        return;
      }

      /* Store user data */
      localStorage.setItem("user", JSON.stringify(data.user));
      localStorage.setItem("role", role);
      localStorage.setItem("name",  data.user.name  || "User");
      localStorage.setItem("phone", data.user.phone || phone);
      localStorage.setItem("lang",  data.user.preferred_language || "hi");

      /* Redirect based on role */
      const redirectMap = {
        patient: "patient-dashboard.html",
        doctor:  "doctor-dashboard.html",
        admin:   "admin-dashboard.html",
      };

      window.location.href = redirectMap[role];

    } catch (err) {
      msgEl.textContent = 'Could not connect to server. Please try again.';
    }
  }
</script>

<script src="script.js"></script>
</body>
</html>
