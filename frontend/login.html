<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>

<div class="login-card">
  <h2>User Login</h2>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">Login</button>

  <p id="msg" class="msg"></p>
</div>

<script>
async function login() {

  const emailInput = document.getElementById("email").value;
  const passwordInput = document.getElementById("password").value;

  const res = await fetch("http://127.0.0.1:8000/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      email: emailInput,
      password: passwordInput
    })
  });

  const data = await res.json();

  if (!data.success) {
    document.getElementById("msg").innerText = data.message;
    return;
  }

  /* ---------- STEP 2 : STORE USER DATA ---------- */

  localStorage.setItem("user", JSON.stringify(data.user));

  /* store extra data for profile page */
  localStorage.setItem("name", data.user.name || "Demo Patient");
  localStorage.setItem("phone", data.user.phone || "Not available");
  localStorage.setItem("lang", data.user.preferred_language || "hi");

  window.location.href = "profile.html";
}
</script>

</body>
</html>
