<!DOCTYPE html>
<html>
<head>

<title>Doctor Dashboard</title>

<link rel="stylesheet" href="doctor.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<div class="dashboard">

<!-- SIDEBAR -->

<div class="sidebar">

<h2 class="logo">
<i class="fa fa-microphone"></i> AI Voice Hospital
</h2>

<ul>

<li class="active">
<i class="fa fa-home"></i> Dashboard
</li>

<li onclick="showSection('records')">
<i class="fa fa-file"></i> View Records
</li>

<li onclick="logout()">
<i class="fa fa-sign-out"></i> Logout
</li>

</ul>

</div>

<!-- MAIN AREA -->

<div class="main">

<div id="dashboard" class="section">

<h1>Doctor Statistics</h1>

<table class="stats">

<thead>
<tr>
<th>Doctor Name</th>
<th>Appointments Today</th>
<th>Total Patients</th>
<th>Give Rating</th>
</tr>
</thead>

<tbody id="doctorTable">
<!-- DATA WILL COME FROM BACKEND -->
</tbody>

</table>

</div>

<!-- VIEW RECORDS -->

<div id="records" class="section hidden">

<div class="card">

<h3>View Records</h3>

<table>

<thead>
<tr>
<th>Name</th>
<th>Age</th>
<th>Condition</th>
</tr>
</thead>

<tbody id="recordsTable">
</tbody>

</table>

</div>

</div>

</div>

</div>

<script src="doctor.js"></script>

</body>
</html>
