<!DOCTYPE html>
<html>
<head>
<title>Doctor Dashboard</title>
<link rel="stylesheet" href="doctor.css">
</head>

<body>

<nav class="navbar">
<div class="logo">AI Voice Hospital</div>

<div class="nav-right">
<button onclick="location.href='../indexx.html'">Home</button>
<button onclick="logout()">Logout</button>
</div>
</nav>

<div class="container">

<h1>Doctor Dashboard</h1>

<div class="cards">

<div class="card">
<h3>Appointments Today</h3>
<p id="todayAppointments">0</p>
</div>

<div class="card">
<h3>Total Patients</h3>
<p id="totalPatients">0</p>
</div>

<div class="card">
<h3>Prescriptions</h3>
<p id="prescriptionCount">0</p>
</div>

</div>


<div class="section">

<h2>Appointments</h2>

<table>

<thead>
<tr>
<th>Patient</th>
<th>Time</th>
<th>Reason</th>
</tr>
</thead>

<tbody id="appointments"></tbody>

</table>

</div>


<div class="section">

<h2>Patients</h2>

<table>

<thead>
<tr>
<th>Name</th>
<th>Age</th>
<th>Condition</th>
</tr>
</thead>

<tbody id="patients"></tbody>

</table>

</div>

</div>

<script src="doctor.js"></script>

</body>
</html>
