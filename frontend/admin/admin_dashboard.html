<!DOCTYPE html>
<html>

</head>

<body>

<nav class="navbar">

<div class="logo">AI Voice Hospital</div>

<div class="nav-right">
<button onclick="location.href='../indexx.html'">Home</button>

</div>

</nav>

<div class="container">

<h1>Patient Dashboard</h1>

<div class="cards">

<h3>Your Doctors</h3>
<p id="doctorCount">0</p>

<thead>
