<!DOCTYPE html>
<html>
<head>

<title>Patient Dashboard</title>

<link rel="stylesheet" href="patient.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<div class="dashboard">

<!-- SIDEBAR -->

<div class="sidebar">

<h2 class="logo">
<i class="fa fa-microphone"></i> AI Voice Hospital
</h2>

<ul>

<li onclick="showSection('dashboard')" class="active">
<i class="fa fa-home"></i> Dashboard
</li>

<li onclick="showSection('appointments')">
<i class="fa fa-calendar"></i> My Appointments
</li>

<li onclick="showSection('records')">
<i class="fa fa-file"></i> Medical Records
</li>

<li onclick="window.location.href='../indexx.html'">
<i class="fa fa-microphone"></i> Book Appointment
</li>

<li onclick="logout()">
<i class="fa fa-sign-out"></i> Logout
</li>

</ul>

</div>

<!-- MAIN AREA -->

<div class="main">

<h1>Patient Dashboard</h1>

<!-- DASHBOARD -->

<div id="dashboard" class="section">

<div class="stats">

<div class="statCard">
<h3>Your Doctors</h3>
<p id="doctorCount">0</p>
</div>

<div class="statCard">
<h3>Appointments</h3>
<p id="appointmentCount">0</p>
</div>

<div class="statCard">
<h3>Reports</h3>
<p id="reportCount">0</p>
</div>

</div>

</div>

<div id="appointments" class="section hidden appointments-section">
  <h2>My Appointments</h2>
  <div class="appointments-table-container">
    <table>
      <thead>
        <tr>
          <th>Appointment ID</th>
          <th>Doctor</th>
          <th>Contact</th>
          <th>Email</th>
          <th>Date</th>
          <th>Time</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="appointmentsTable"></tbody>
    </table>
  </div>
</div>

<!-- RECORDS -->

<div id="records" class="section hidden">

<h2>Medical Records</h2>

<table>

<thead>
<tr>
<th>Doctor</th>
<th>Diagnosis</th>
<th>Date</th>
</tr>
</thead>

<tbody id="recordsTable"></tbody>

</table>

</div>

</div>

</div>

<script src="patient.js"></script>

</body>
</html>
