<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Voice Hospital Assistant</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="theme.css">
  <style>
    /* Profile icon styles */
    .profile-container {
      position: relative;
      display: inline-block;
    }

    .profile-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      font-size: 1.2rem;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      margin-left: 12px;
    }

    .profile-icon:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(79,195,247,0.4);
    }

    /* Dropdown menu */
    .profile-dropdown {
      position: absolute;
      top: 50px;
      right: 0;
      background: rgba(30, 30, 40, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      min-width: 240px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: all 0.2s ease;
      z-index: 1000;
    }

    .profile-dropdown.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .dropdown-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .dropdown-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 600;
    }

    .dropdown-info {
      flex: 1;
    }

    .dropdown-name {
      font-weight: 600;
      color: var(--text);
      font-size: 14px;
      margin-bottom: 4px;
    }

    .dropdown-email {
      font-size: 12px;
      color: var(--muted);
    }

    .dropdown-item {
      padding: 12px 16px;
      cursor: pointer;
      transition: background 0.2s;
      color: var(--text);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
    }

    .dropdown-item:hover {
      background: rgba(255,255,255,0.05);
    }

    .dropdown-divider {
      height: 1px;
      background: var(--border);
      margin: 8px 0;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Ensure existing styles remain intact */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 32px;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .nav-left .logo {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .nav-btn, .logout-btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .nav-btn:hover {
      background: rgba(255,255,255,0.05);
      border-color: var(--accent);
    }

    .logout-btn:hover {
      background: rgba(239,68,68,0.1);
      border-color: var(--error);
      color: var(--error);
    }

    /* ========== ADDED STYLES ========== */
    /* Subtitle bar */
    #subtitleBar {
      display: none;
      margin: 12px auto 0;
      max-width: 560px;
      background: rgba(255,255,255,0.07);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 14px;
      color: var(--text);
      min-height: 40px;
      text-align: center;
      line-height: 1.5;
    }

    /* Loader overlay */
    #loaderOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 9000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }

    #loaderOverlay.show {
      display: flex;
    }

    .loader-spinner {
      width: 52px;
      height: 52px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loader-text {
      color: #fff;
      font-size: 15px;
      letter-spacing: 0.5px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Success popup */
    #successPopup {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 9100;
      align-items: center;
      justify-content: center;
    }

    #successPopup.show {
      display: flex;
    }

    .success-box {
      background: rgba(20, 30, 40, 0.97);
      border: 1px solid #4caf50;
      border-radius: 16px;
      padding: 36px 40px;
      text-align: center;
      max-width: 340px;
      width: 90%;
      animation: popIn 0.25s ease;
    }

    .success-box .success-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .success-box h3 {
      color: #4caf50;
      margin: 0 0 8px;
      font-size: 1.2rem;
    }

    .success-box p {
      color: var(--muted, #aaa);
      font-size: 14px;
      margin: 0 0 20px;
    }

    .success-box button {
      padding: 10px 28px;
      border-radius: 8px;
      border: none;
      background: #4caf50;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
    }

    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }

    /* Calendar popup */
    #calendarPopup {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 9200;
      align-items: center;
      justify-content: center;
    }

    #calendarPopup.show {
      display: flex;
    }

    .cal-box {
      background: rgba(20, 30, 40, 0.97);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      width: 320px;
      animation: popIn 0.25s ease;
    }

    .cal-box h3 {
      color: var(--text);
      margin: 0 0 16px;
      font-size: 1rem;
      text-align: center;
    }

    .cal-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .cal-nav button {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 4px 12px;
      cursor: pointer;
      font-size: 16px;
    }

    .cal-nav span {
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
    }

    .cal-grid-popup {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .cal-grid-popup .ch {
      text-align: center;
      font-size: 11px;
      color: var(--muted, #888);
      padding: 4px 0;
      font-weight: 600;
    }

    .cal-grid-popup .cd {
      text-align: center;
      padding: 7px 4px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      color: var(--text);
      transition: background 0.15s;
    }

    .cal-grid-popup .cd:hover { background: rgba(79,195,247,0.15); }
    .cal-grid-popup .cd.today { border: 1px solid var(--accent); }
    .cal-grid-popup .cd.past  { opacity: 0.35; pointer-events: none; }

    /* Region popup */
    #regionPopup {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 9300;
      align-items: center;
      justify-content: center;
    }

    #regionPopup.show {
      display: flex;
    }

    .region-box {
      background: rgba(20, 30, 40, 0.97);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 32px;
      width: 320px;
      animation: popIn 0.25s ease;
    }

    .region-box h3 {
      color: var(--text);
      margin: 0 0 16px;
      font-size: 1rem;
      text-align: center;
    }

    .region-box select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      margin-bottom: 16px;
    }

    .region-box button {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-left">
      <span class="logo">AI Voice Hospital</span>
    </div>
    <div class="nav-right">
      <button id="dashboardBtn" class="nav-btn" onclick="window.location.href='patient/patient_dashboard.html'">
       Dashboard
      </button>
      
      <!-- ADDED: Theme toggle button -->
      <button id="themeToggleBtn" class="nav-btn" onclick="toggleTheme()">🌙</button>
      
      <!-- Profile Icon with Dropdown -->
      <div class="profile-container">
        <div class="profile-icon" id="profileIcon">
          👤
        </div>
        <div class="profile-dropdown" id="profileDropdown">
          <div class="dropdown-header">
            <div class="dropdown-avatar" id="dropdownAvatar">👤</div>
            <div class="dropdown-info">
              <div class="dropdown-name" id="dropdownName">Guest User</div>
              <div class="dropdown-email" id="dropdownEmail">Not signed in</div>
            </div>
          </div>
          <div class="dropdown-item" onclick="window.location.href='profile.html'">
            👤 View Profile
          </div>
          <div class="dropdown-divider"></div>
          <div class="dropdown-item" onclick="logout()">
            🚪 Logout
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="glass-card">
    <div class="top-bar">
      Namaste, I'm listening…
    </div>

    <div class="orbital">
      <!-- Language bubbles -->
      <button class="bubble top active" data-lang="hi">🌸<span>Hindi</span></button>
      <button class="bubble left" data-lang="mr">📜<span>Marathi</span></button>
      <button class="bubble right" data-lang="en">☁️<span>English</span></button>
      <button class="bubble bottom-left" data-lang="ta">🏺<span>Tamil</span></button>
      <button class="bubble bottom-right" data-lang="te">🌿<span>Telugu</span></button>
      <button class="bubble bottom" data-lang="gu">🪔<span>Gujarati</span></button>

      <!-- Center microphone -->
      <button id="recordBtn" class="mic-orb">🎤</button>
    </div>

    <p id="status">Tap the mic and speak</p>

    <!-- ADDED: Subtitle bar -->
    <div id="subtitleBar"></div>

    <div class="audio-wrapper">
      <div class="custom-player">
        <button id="playBtn" class="play-btn">▶</button>
        <div class="progress-container">
          <div id="progress" class="progress"></div>
        </div>
        <span id="time">0:00</span>
      </div>
      <audio id="audioPlayer"></audio>
    </div>
  </div>

  <!-- ADDED: Loader overlay -->
  <div id="loaderOverlay">
    <div class="loader-spinner"></div>
    <div class="loader-text">Processing your request…</div>
  </div>

  <!-- ADDED: Success popup -->
  <div id="successPopup">
    <div class="success-box">
      <div class="success-icon">✅</div>
      <h3>Appointment Booked!</h3>
      <p id="successMsg">Your appointment has been successfully booked.</p>
      <button onclick="closeSuccessPopup()">OK</button>
    </div>
  </div>

  <!-- ADDED: Calendar popup -->
  <div id="calendarPopup">
    <div class="cal-box">
      <h3>Select Appointment Date</h3>
      <div class="cal-nav">
        <button onclick="calChangeMonth(-1)">&#8249;</button>
        <span id="calPopupLabel"></span>
        <button onclick="calChangeMonth(1)">&#8250;</button>
      </div>
      <div class="cal-grid-popup" id="calPopupGrid"></div>
    </div>
  </div>

  <!-- ADDED: Region popup -->
  <div id="regionPopup">
    <div class="region-box">
      <h3>Select Your Region</h3>
      <select id="regionSelect">
        <option value="">-- Select Region --</option>
        <option value="Mumbai">Mumbai</option>
        <option value="Pune">Pune</option>
        <option value="Nagpur">Nagpur</option>
        <option value="Nashik">Nashik</option>
        <option value="Aurangabad">Aurangabad</option>
        <option value="Thane">Thane</option>
        <option value="Solapur">Solapur</option>
        <option value="Kolhapur">Kolhapur</option>
      </select>
      <button onclick="confirmRegion()">Confirm</button>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    // Toggle dropdown
    const profileIcon = document.getElementById('profileIcon');
    const profileDropdown = document.getElementById('profileDropdown');

    if (profileIcon && profileDropdown) {
      profileIcon.addEventListener('click', (e) => {
        e.stopPropagation();
        profileDropdown.classList.toggle('show');
      });

      // Close dropdown when clicking outside
      document.addEventListener('click', (e) => {
        if (!profileIcon.contains(e.target) && !profileDropdown.contains(e.target)) {
          profileDropdown.classList.remove('show');
        }
      });
    }

    // Update profile info based on logged-in user
    function updateProfileInfo() {
      const patient = JSON.parse(localStorage.getItem("patient") || "{}");
      const profileIconEl = document.getElementById("profileIcon");
      const dropdownAvatar = document.getElementById("dropdownAvatar");
      const dropdownName = document.getElementById("dropdownName");
      const dropdownEmail = document.getElementById("dropdownEmail");
      
      if (patient && patient.name) {
        const firstLetter = patient.name.charAt(0).toUpperCase();
        const gender = patient.gender ? patient.gender.toLowerCase() : '';
        
        // Set avatar icon
        if (gender === "female") {
          profileIconEl.innerHTML = "👩";
          if (dropdownAvatar) dropdownAvatar.innerHTML = "👩";
        } else if (gender === "male") {
          profileIconEl.innerHTML = "👨";
          if (dropdownAvatar) dropdownAvatar.innerHTML = "👨";
        } else {
          profileIconEl.innerHTML = firstLetter;
          if (dropdownAvatar) dropdownAvatar.innerHTML = firstLetter;
        }
        
        // Update dropdown info
        if (dropdownName) dropdownName.textContent = patient.name;
        if (dropdownEmail) dropdownEmail.textContent = patient.phone || "No phone number";
        
        // Style based on gender
        if (gender === "female") {
          const gradient = "linear-gradient(135deg, #FF6B6B, #FF8E8E)";
          profileIconEl.style.background = gradient;
          if (dropdownAvatar) dropdownAvatar.style.background = gradient;
        } else if (gender === "male") {
          const gradient = "linear-gradient(135deg, #4A90E2, #6BA5F0)";
          profileIconEl.style.background = gradient;
          if (dropdownAvatar) dropdownAvatar.style.background = gradient;
        }
      } else {
        profileIconEl.innerHTML = "👤";
        if (dropdownAvatar) dropdownAvatar.innerHTML = "👤";
        if (dropdownName) dropdownName.textContent = "Guest User";
        if (dropdownEmail) dropdownEmail.textContent = "Not signed in";
      }
    }

    // Logout function
    function logout() {
    if (confirm('Are you sure you want to logout?')) {
        localStorage.clear();
        window.location.href = "login.html";
     }
    }

    /* ========== ADDED FUNCTIONS ========== */
    // Theme toggle
    function toggleTheme() {
      if (document.body.classList.contains('dark-theme')) {
        document.body.classList.remove('dark-theme');
        localStorage.setItem('theme', 'light');
        const btn = document.getElementById('themeToggleBtn');
        if (btn) btn.textContent = '🌙';
      } else {
        document.body.classList.add('dark-theme');
        localStorage.setItem('theme', 'dark');
        const btn = document.getElementById('themeToggleBtn');
        if (btn) btn.textContent = '☀️';
      }
    }

    // Loader helpers
    function showLoader() {
      document.getElementById('loaderOverlay').classList.add('show');
    }
    function hideLoader() {
      document.getElementById('loaderOverlay').classList.remove('show');
    }

    // Success popup helpers
    function showSuccessPopup(msg) {
      if (msg) document.getElementById('successMsg').textContent = msg;
      document.getElementById('successPopup').classList.add('show');
    }
    function closeSuccessPopup() {
      document.getElementById('successPopup').classList.remove('show');
    }

    // Calendar popup
    let calPopupDate = new Date();
    let calPopupResolve = null;

    function openCalendarPopup() {
      return new Promise(resolve => {
        calPopupResolve = resolve;
        calPopupDate = new Date();
        renderCalPopup();
        document.getElementById('calendarPopup').classList.add('show');
      });
    }

    function closeCalendarPopup() {
      document.getElementById('calendarPopup').classList.remove('show');
      calPopupResolve = null;
    }

    function calChangeMonth(dir) {
      calPopupDate.setMonth(calPopupDate.getMonth() + dir);
      renderCalPopup();
    }

    function renderCalPopup() {
      const year = calPopupDate.getFullYear();
      const month = calPopupDate.getMonth();
      const today = new Date();
      today.setHours(0,0,0,0);

      document.getElementById('calPopupLabel').textContent =
        calPopupDate.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });

      const grid = document.getElementById('calPopupGrid');
      grid.innerHTML = '';

      ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(d => {
        const h = document.createElement('div');
        h.className = 'ch';
        h.textContent = d;
        grid.appendChild(h);
      });

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const blank = document.createElement('div');
        grid.appendChild(blank);
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const cell = document.createElement('div');
        cell.className = 'cd';
        cell.textContent = d;

        const thisDate = new Date(year, month, d);
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

        if (thisDate.getTime() === today.getTime()) cell.classList.add('today');
        if (thisDate < today) cell.classList.add('past');

        cell.onclick = () => {
          document.getElementById('calendarPopup').classList.remove('show');
          if (calPopupResolve) calPopupResolve(dateStr);
        };

        grid.appendChild(cell);
      }
    }

    // Region popup
    let regionResolve = null;

    function openRegionPopup() {
      return new Promise(resolve => {
        regionResolve = resolve;
        document.getElementById('regionSelect').value = '';
        document.getElementById('regionPopup').classList.add('show');
      });
    }

    function confirmRegion() {
      const val = document.getElementById('regionSelect').value;
      if (!val) { alert('Please select a region.'); return; }
      document.getElementById('regionPopup').classList.remove('show');
      if (regionResolve) regionResolve(val);
    }

    // Apply saved theme on load
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      document.body.classList.add('dark-theme');
      const btn = document.getElementById('themeToggleBtn');
      if (btn) btn.textContent = '☀️';
    }

    // Initialize
    document.addEventListener("DOMContentLoaded", updateProfileInfo);
  </script>
</body>
</html>
